server {
    listen 80;
    server_name _;

    # Serve React static files
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — if file not found, serve index.html
    # This makes React Router work (page refresh won't 404)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy — /api/students → backend:8080/students
    # "backend" is the Docker Compose service name
    # Docker's internal DNS resolves it automatically
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Cache static assets for 1 year (JS, CSS, images)
    location ~* \.(js|css|png|jpg|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression — reduces network transfer
    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1024;
}
